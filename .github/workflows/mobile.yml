name: mobile

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Localizations (no untranslated messages)
        run: |
          flutter gen-l10n
          untranslated="$(tr -d '[:space:]' < build/untranslated_messages.json)"
          if [ "$untranslated" != "{}" ]; then
            echo "::error::Untranslated messages: $untranslated"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Format
        run: dart format --set-exit-if-changed lib test

      # The `live` tests skip themselves without STOCKLY_LIVE_API
      # (dart_test.yaml); --exclude-tags keeps them out of CI entirely.
      - name: Test with coverage
        run: flutter test --coverage --exclude-tags live

      - name: Coverage gate (domain and providers >= 80%)
        run: dart run tool/coverage_gate.dart

      - name: Debug APK (fake backend)
        run: flutter build apk --debug --dart-define=STOCKLY_BACKEND=fake

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
