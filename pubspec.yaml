name: stockly
description: "Stockly: AI inventory for small shops in Egypt (Arabic first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  decimal: ^3.2.6
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/readex_pro/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/readex_pro/ReadexPro-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
